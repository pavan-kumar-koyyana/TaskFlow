<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Smart To-Do Dashboard</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbars & Micro-animations */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }

    .task-enter {
      animation: slideFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .dragging {
      opacity: 0.45;
      transform: scale(0.98);
      border: 2px dashed #6366f1 !important;
    }

    .drag-over {
      border-top: 2px solid #6366f1 !important;
    }

    /* Progress Ring Transition */
    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Custom Checkbox Bounce */
    .check-bounce:active {
      transform: scale(0.85);
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Confetti Canvas Overlay -->
  <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- Main Container -->
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 md:py-12">
    
    <!-- Top Header & Actions -->
    <header class="flex items-center justify-between gap-3 mb-7">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 flex-shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <div class="flex items-center gap-2 sm:gap-2.5 flex-wrap">
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-600 dark:from-white dark:to-slate-400 bg-clip-text text-transparent">TaskFlow</h1>
          <span id="currentDateBadge" class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 dark:bg-indigo-950/70 dark:text-indigo-300 border border-indigo-200/60 dark:border-indigo-800/60 whitespace-nowrap"></span>
        </div>
      </div>

      <!-- Utility Controls: Theme Toggle -->
      <div class="flex items-center flex-shrink-0">
        <button id="themeToggle" aria-label="Toggle Dark Mode" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 text-slate-700 dark:text-amber-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm">
          <!-- Sun Icon -->
          <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
          </svg>
          <!-- Moon Icon -->
          <svg id="moonIcon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Productivity Stats & Progress Dashboard -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
      <!-- Completion Card -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/90 rounded-2xl p-4 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Completion</p>
          <p id="progressPercent" class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-0.5">0%</p>
          <p id="statCompletedSummary" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">0 of 0 done</p>
        </div>
        <div class="relative w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 flex items-center justify-center flex-shrink-0">
          <svg class="w-8 h-8" viewBox="0 0 60 60">
            <circle class="text-indigo-200/70 dark:text-indigo-900/70" stroke-width="7" stroke="currentColor" fill="transparent" r="24" cx="30" cy="30"/>
            <circle id="progressRing" class="text-indigo-600 dark:text-indigo-400 progress-ring-circle" stroke-width="7" stroke-dasharray="150.79" stroke-dashoffset="150.79" stroke-linecap="round" stroke="currentColor" fill="transparent" r="24" cx="30" cy="30"/>
          </svg>
        </div>
      </div>

      <!-- Active Tasks Card -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/90 rounded-2xl p-4 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Active</p>
          <p id="statActive" class="text-2xl font-extrabold text-slate-800 dark:text-slate-100 mt-0.5">0</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">In progress</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>

      <!-- High Priority Pending -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/90 rounded-2xl p-4 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">High Priority</p>
          <p id="statHighPriority" class="text-2xl font-extrabold text-amber-600 dark:text-amber-400 mt-0.5">0</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Needs focus</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0112 21 8.25 8.25 0 016.038 7.048 8.287 8.287 0 009 9.6a8.983 8.983 0 013.361-6.867 8.21 8.21 0 003 2.48z"/></svg>
        </div>
      </div>

      <!-- Overdue Tasks -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/90 rounded-2xl p-4 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Overdue</p>
          <p id="statOverdue" class="text-2xl font-extrabold text-rose-600 dark:text-rose-400 mt-0.5">0</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Past due date</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
        </div>
      </div>
    </section>

    <!-- Main Dashboard Card -->
    <main class="bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none overflow-hidden">
      
      <!-- Task Creation Form -->
      <div class="p-5 sm:p-6 bg-slate-50/60 dark:bg-slate-900/50 border-b border-slate-200/80 dark:border-slate-800">
        <form id="addTaskForm" class="space-y-3">
          <div class="flex flex-col sm:flex-row gap-2.5">
            <div class="relative flex-1">
              <input 
                type="text" 
                id="taskInput" 
                placeholder="What needs to get done? (Press Enter to add)" 
                maxlength="160"
                required
                class="w-full pl-4 pr-10 py-3 rounded-xl bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/80 text-sm sm:text-base placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition shadow-sm"
              >
            </div>
            <button 
              type="submit" 
              id="addBtn"
              class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold text-sm shadow-md shadow-indigo-500/20 transition flex items-center justify-center gap-2 flex-shrink-0"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              <span>Add Task</span>
            </button>
          </div>

          <!-- Metadata Selectors Row -->
          <div class="flex flex-wrap items-center gap-2.5 pt-1">
            <!-- Priority Selector -->
            <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl px-3 py-1.5 text-xs">
              <span class="text-slate-400 dark:text-slate-500 font-medium">Priority:</span>
              <select id="priorityInput" class="bg-transparent font-semibold text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer">
                <option value="low" class="dark:bg-slate-800">Low</option>
                <option value="medium" selected class="dark:bg-slate-800">Medium</option>
                <option value="high" class="dark:bg-slate-800">High</option>
              </select>
            </div>

            <!-- Category Selector -->
            <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl px-3 py-1.5 text-xs">
              <span class="text-slate-400 dark:text-slate-500 font-medium">Category:</span>
              <select id="categoryInput" class="bg-transparent font-semibold text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer">
                <option value="Work" class="dark:bg-slate-800">💼 Work</option>
                <option value="Personal" class="dark:bg-slate-800">🏠 Personal</option>
                <option value="Shopping" class="dark:bg-slate-800">🛒 Shopping</option>
                <option value="Health" class="dark:bg-slate-800">💪 Health</option>
                <option value="Finance" class="dark:bg-slate-800">💰 Finance</option>
              </select>
            </div>

            <!-- Due Date Picker -->
            <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl px-3 py-1.5 text-xs">
              <span class="text-slate-400 dark:text-slate-500 font-medium">Due:</span>
              <input type="date" id="dueDateInput" class="bg-transparent font-semibold text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer">
            </div>

            <!-- Toggle Notes / Subtask Input -->
            <button type="button" id="toggleExtraInputBtn" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline px-2 py-1 flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              <span>Add Note / Subtasks</span>
            </button>
          </div>

          <!-- Collapsible Notes & Initial Subtasks Input -->
          <div id="extraInputContainer" class="hidden pt-2 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <input 
              type="text" 
              id="noteInput" 
              placeholder="Optional note or context..." 
              class="w-full px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:border-indigo-500"
            >
            <input 
              type="text" 
              id="subtasksInput" 
              placeholder="Subtasks (comma separated, e.g. Draft slides, Send email)" 
              class="w-full px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:border-indigo-500"
            >
          </div>
        </form>
      </div>

      <!-- Search, Filters & Sorting Bar -->
      <div class="p-4 sm:px-6 border-b border-slate-200/70 dark:border-slate-800/80 space-y-3">
        <div class="flex flex-col md:flex-row gap-3 justify-between">
          <!-- Status Filter Pills -->
          <div id="statusFilters" class="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0">
            <button data-status="all" class="status-pill active px-3.5 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap">All</button>
            <button data-status="active" class="status-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap">Active</button>
            <button data-status="done" class="status-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap">Done</button>
            <button data-status="overdue" class="status-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Overdue
            </button>
          </div>

          <!-- Search & Dropdown Filters -->
          <div class="flex flex-wrap sm:flex-nowrap items-center gap-2">
            <!-- Search Input -->
            <div class="relative flex-1 sm:w-56">
              <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
              <input 
                type="text" 
                id="searchInput" 
                placeholder="Search tasks... (/)" 
                class="w-full pl-9 pr-7 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800/90 border border-transparent focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-800 text-xs focus:outline-none transition"
              >
              <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">✕</button>
            </div>

            <!-- Category Filter -->
            <select id="filterCategory" aria-label="Filter by category" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 border border-transparent focus:border-indigo-500 focus:outline-none cursor-pointer">
              <option value="all">All Categories</option>
              <option value="Work">💼 Work</option>
              <option value="Personal">🏠 Personal</option>
              <option value="Shopping">🛒 Shopping</option>
              <option value="Health">💪 Health</option>
              <option value="Finance">💰 Finance</option>
            </select>

            <!-- Sort Order -->
            <select id="sortSelect" aria-label="Sort tasks" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 border border-transparent focus:border-indigo-500 focus:outline-none cursor-pointer">
              <option value="manual">Sort: Custom / Newest</option>
              <option value="priority">Sort: Priority (High → Low)</option>
              <option value="dueDate">Sort: Due Date (Soonest)</option>
              <option value="alpha">Sort: A → Z</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Task List Container -->
      <div class="p-4 sm:p-6 min-h-[300px]">
        <ul id="list" class="space-y-2.5"></ul>
      </div>

      <!-- Footer Bar -->
      <div class="px-5 py-4 bg-slate-50/80 dark:bg-slate-900/90 border-t border-slate-200/80 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500 dark:text-slate-400">
        <div class="flex items-center gap-3">
          <span id="countLabel" class="font-medium">0 items left</span>
          <span class="hidden sm:inline text-slate-300 dark:text-slate-700">•</span>
          <span class="hidden sm:inline text-[11px] text-slate-400">Tip: Drag tasks to reorder or click edit to customize</span>
        </div>

        <div class="flex items-center gap-4">
          <button id="markAllBtn" class="hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition">Mark all done</button>
          <button id="clearDone" class="hover:text-rose-600 dark:hover:text-rose-400 font-medium transition">Clear completed</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div id="editModal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-900 dark:text-slate-100">Edit Task</h3>
        <button id="closeEditModal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg">✕</button>
      </div>
      <form id="editTaskForm" class="space-y-3.5">
        <input type="hidden" id="editTaskId">
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Task Title</label>
          <input type="text" id="editTitleInput" required maxlength="160" class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Priority</label>
            <select id="editPriorityInput" class="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium focus:outline-none">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Category</label>
            <select id="editCategoryInput" class="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium focus:outline-none">
              <option value="Work">💼 Work</option>
              <option value="Personal">🏠 Personal</option>
              <option value="Shopping">🛒 Shopping</option>
              <option value="Health">💪 Health</option>
              <option value="Finance">💰 Finance</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Due Date</label>
            <input type="date" id="editDueDateInput" class="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Notes</label>
          <textarea id="editNoteInput" rows="2" placeholder="Add helpful details or links..." class="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEditBtn" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification with Undo -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    (function(){
      // --- Constants & Storage Keys ---
      const STORAGE_KEY = 'taskflow_tasks_v1';
      const THEME_KEY = 'taskflow_pro_theme';

      const CATEGORY_META = {
        Work:     { icon: '💼', classes: 'bg-blue-50 text-blue-700 dark:bg-blue-950/70 dark:text-blue-300 border-blue-200/60 dark:border-blue-800/60' },
        Personal: { icon: '🏠', classes: 'bg-purple-50 text-purple-700 dark:bg-purple-950/70 dark:text-purple-300 border-purple-200/60 dark:border-purple-800/60' },
        Shopping: { icon: '🛒', classes: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-300 border-emerald-200/60 dark:border-emerald-800/60' },
        Health:   { icon: '💪', classes: 'bg-rose-50 text-rose-700 dark:bg-rose-950/70 dark:text-rose-300 border-rose-200/60 dark:border-rose-800/60' },
        Finance:  { icon: '💰', classes: 'bg-amber-50 text-amber-700 dark:bg-amber-950/70 dark:text-amber-300 border-amber-200/60 dark:border-amber-800/60' }
      };

      const PRIORITY_META = {
        high:   { label: 'High', weight: 3, classes: 'bg-rose-100/80 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 border-rose-300/60 dark:border-rose-800' },
        medium: { label: 'Medium', weight: 2, classes: 'bg-amber-100/80 text-amber-700 dark:bg-amber-950/80 dark:text-amber-300 border-amber-300/60 dark:border-amber-800' },
        low:    { label: 'Low', weight: 1, classes: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-300/60 dark:border-slate-700' }
      };

      // --- State ---
      let tasks = [];
      let statusFilter = 'all';
      let categoryFilter = 'all';
      let searchQuery = '';
      let sortBy = 'manual';
      let expandedTasks = new Set();
      let draggedTaskId = null;
      let lastDeletedTask = null;

      // --- DOM Elements ---
      const listEl = document.getElementById('list');
      const addTaskForm = document.getElementById('addTaskForm');
      const taskInput = document.getElementById('taskInput');
      const priorityInput = document.getElementById('priorityInput');
      const categoryInput = document.getElementById('categoryInput');
      const dueDateInput = document.getElementById('dueDateInput');
      const noteInput = document.getElementById('noteInput');
      const subtasksInput = document.getElementById('subtasksInput');
      const toggleExtraInputBtn = document.getElementById('toggleExtraInputBtn');
      const extraInputContainer = document.getElementById('extraInputContainer');

      const statusFiltersEl = document.getElementById('statusFilters');
      const filterCategoryEl = document.getElementById('filterCategory');
      const sortSelectEl = document.getElementById('sortSelect');
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      const countLabel = document.getElementById('countLabel');
      const clearDoneBtn = document.getElementById('clearDone');
      const markAllBtn = document.getElementById('markAllBtn');

      const themeToggleBtn = document.getElementById('themeToggle');

      // Edit Modal Elements
      const editModal = document.getElementById('editModal');
      const editTaskForm = document.getElementById('editTaskForm');
      const editTaskId = document.getElementById('editTaskId');
      const editTitleInput = document.getElementById('editTitleInput');
      const editPriorityInput = document.getElementById('editPriorityInput');
      const editCategoryInput = document.getElementById('editCategoryInput');
      const editDueDateInput = document.getElementById('editDueDateInput');
      const editNoteInput = document.getElementById('editNoteInput');
      const closeEditModal = document.getElementById('closeEditModal');
      const cancelEditBtn = document.getElementById('cancelEditBtn');

      // --- Utility Helpers ---
      function generateId() {
        return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      function getTodayStr() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function getRelativeDateOffset(days) {
        const d = new Date();
        d.setDate(d.getDate() + days);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function isOverdue(task) {
        if (task.done || !task.dueDate) return false;
        return task.dueDate < getTodayStr();
      }

      function formatDueDate(dateStr) {
        if (!dateStr) return null;
        const today = getTodayStr();
        const tomorrow = getRelativeDateOffset(1);
        const yesterday = getRelativeDateOffset(-1);

        if (dateStr === today) return { text: 'Due Today', status: 'today' };
        if (dateStr === tomorrow) return { text: 'Tomorrow', status: 'upcoming' };
        if (dateStr === yesterday) return { text: 'Yesterday', status: 'overdue' };

        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        const formatted = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        if (dateStr < today) return { text: `Overdue · ${formatted}`, status: 'overdue' };
        return { text: formatted, status: 'upcoming' };
      }

      // --- Theme Management ---
      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }

      themeToggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      });

      // --- LocalStorage & Starter Tasks ---
      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          tasks = raw ? JSON.parse(raw) : [];
        } catch (e) {
          tasks = [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
          console.error('Could not save tasks to localStorage', e);
        }
      }

      // --- Toast Notification System ---
      function showToast(message, undoCallback = null) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-medium shadow-xl border border-slate-700/50 dark:border-slate-300 task-enter';
        
        const span = document.createElement('span');
        span.textContent = message;
        toast.appendChild(span);

        if (undoCallback) {
          const btn = document.createElement('button');
          btn.textContent = 'Undo';
          btn.className = 'px-2.5 py-1 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white font-bold transition';
          btn.addEventListener('click', () => {
            undoCallback();
            toast.remove();
          });
          toast.appendChild(btn);
        }

        container.appendChild(toast);
        setTimeout(() => {
          if (toast.parentElement) {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.2s ease';
            setTimeout(() => toast.remove(), 200);
          }
        }, 4200);
      }

      // --- Confetti Celebration Effect ---
      function fireConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = Array.from({ length: 70 }, () => ({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 100,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          color: ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'][Math.floor(Math.random() * 5)],
          vy: 2.5 + Math.random() * 4,
          vx: (Math.random() - 0.5) * 3,
          angle: Math.random() * 360,
          spin: (Math.random() - 0.5) * 8
        }));

        let frame = 0;
        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.angle += p.spin;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.angle * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });
          frame++;
          if (frame < 140) {
            requestAnimationFrame(animate);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }
        requestAnimationFrame(animate);
      }

      // --- Core Task Actions ---
      function addTask(e) {
        e.preventDefault();
        const text = taskInput.value.trim();
        if (!text) return;

        const rawSubtasks = subtasksInput.value.trim();
        const parsedSubtasks = rawSubtasks
          ? rawSubtasks.split(',').map(s => s.trim()).filter(Boolean).map(st => ({
              id: generateId(),
              text: st,
              done: false
            }))
          : [];

        const newTask = {
          id: generateId(),
          text,
          done: false,
          priority: priorityInput.value || 'medium',
          category: categoryInput.value || 'Work',
          dueDate: dueDateInput.value || '',
          note: noteInput.value.trim(),
          subtasks: parsedSubtasks,
          createdAt: Date.now()
        };

        tasks.unshift(newTask);
        saveTasks();

        // Reset inputs
        taskInput.value = '';
        noteInput.value = '';
        subtasksInput.value = '';
        extraInputContainer.classList.add('hidden');
        render();
        showToast('Task added to your list');
      }

      function toggleTask(taskId) {
        const t = tasks.find(x => x.id === taskId);
        if (!t) return;
        const wasAllDone = tasks.length > 0 && tasks.every(x => x.done);
        t.done = !t.done;
        saveTasks();
        render();

        const isNowAllDone = tasks.length > 0 && tasks.every(x => x.done);
        if (!wasAllDone && isNowAllDone) {
          fireConfetti();
          showToast('🎉 All tasks completed! Stellar work!');
        }
      }

      function removeTask(taskId) {
        const idx = tasks.findIndex(x => x.id === taskId);
        if (idx === -1) return;
        const removed = tasks[idx];
        lastDeletedTask = { task: removed, index: idx };
        tasks.splice(idx, 1);
        saveTasks();
        render();

        showToast(`Deleted "${removed.text.slice(0, 28)}${removed.text.length > 28 ? '…' : ''}"`, () => {
          if (lastDeletedTask) {
            tasks.splice(lastDeletedTask.index, 0, lastDeletedTask.task);
            lastDeletedTask = null;
            saveTasks();
            render();
          }
        });
      }

      function toggleSubtask(taskId, subtaskId) {
        const task = tasks.find(x => x.id === taskId);
        if (!task || !task.subtasks) return;
        const sub = task.subtasks.find(s => s.id === subtaskId);
        if (sub) {
          sub.done = !sub.done;
          saveTasks();
          render();
        }
      }

      function addSubtaskInline(taskId, text) {
        const clean = text.trim();
        if (!clean) return;
        const task = tasks.find(x => x.id === taskId);
        if (!task) return;
        if (!task.subtasks) task.subtasks = [];
        task.subtasks.push({ id: generateId(), text: clean, done: false });
        expandedTasks.add(taskId);
        saveTasks();
        render();
      }

      function deleteSubtask(taskId, subtaskId) {
        const task = tasks.find(x => x.id === taskId);
        if (!task || !task.subtasks) return;
        task.subtasks = task.subtasks.filter(s => s.id !== subtaskId);
        saveTasks();
        render();
      }

      function openEditModal(taskId) {
        const t = tasks.find(x => x.id === taskId);
        if (!t) return;
        editTaskId.value = t.id;
        editTitleInput.value = t.text;
        editPriorityInput.value = t.priority || 'medium';
        editCategoryInput.value = t.category || 'Work';
        editDueDateInput.value = t.dueDate || '';
        editNoteInput.value = t.note || '';
        editModal.classList.remove('hidden');
        editModal.classList.add('flex');
        editTitleInput.focus();
      }

      function closeEdit() {
        editModal.classList.add('hidden');
        editModal.classList.remove('flex');
      }

      editTaskForm.addEventListener('submit', e => {
        e.preventDefault();
        const t = tasks.find(x => x.id === editTaskId.value);
        if (!t) return;
        const newTitle = editTitleInput.value.trim();
        if (!newTitle) return;

        t.text = newTitle;
        t.priority = editPriorityInput.value;
        t.category = editCategoryInput.value;
        t.dueDate = editDueDateInput.value;
        t.note = editNoteInput.value.trim();

        saveTasks();
        closeEdit();
        render();
        showToast('Task updated');
      });

      closeEditModal.addEventListener('click', closeEdit);
      cancelEditBtn.addEventListener('click', closeEdit);
      editModal.addEventListener('click', e => {
        if (e.target === editModal) closeEdit();
      });

      // --- Dashboard Statistics Update ---
      function updateStats() {
        const total = tasks.length;
        const doneCount = tasks.filter(t => t.done).length;
        const activeCount = total - doneCount;
        const highCount = tasks.filter(t => !t.done && t.priority === 'high').length;
        const overdueCount = tasks.filter(t => isOverdue(t)).length;
        const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);

        document.getElementById('statCompletedSummary').textContent = `${doneCount} of ${total} done`;
        document.getElementById('statActive').textContent = activeCount;
        document.getElementById('statHighPriority').textContent = highCount;
        document.getElementById('statOverdue').textContent = overdueCount;
        document.getElementById('progressPercent').textContent = `${pct}%`;

        const ring = document.getElementById('progressRing');
        const circumference = 150.79;
        const offset = circumference - (pct / 100) * circumference;
        ring.style.strokeDashoffset = offset;

        countLabel.textContent = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;
        markAllBtn.textContent = activeCount === 0 && total > 0 ? 'Unmark all' : 'Mark all done';
      }

      // --- Filtering & Sorting Logic ---
      function getVisibleTasks() {
        let filtered = tasks.filter(t => {
          // Status filter
          if (statusFilter === 'active' && t.done) return false;
          if (statusFilter === 'done' && !t.done) return false;
          if (statusFilter === 'overdue' && !isOverdue(t)) return false;

          // Category filter
          if (categoryFilter !== 'all' && t.category !== categoryFilter) return false;

          // Search query
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const inTitle = t.text.toLowerCase().includes(q);
            const inNote = (t.note || '').toLowerCase().includes(q);
            const inCategory = (t.category || '').toLowerCase().includes(q);
            const inSubtasks = (t.subtasks || []).some(s => s.text.toLowerCase().includes(q));
            if (!inTitle && !inNote && !inCategory && !inSubtasks) return false;
          }
          return true;
        });

        // Sort
        if (sortBy === 'priority') {
          filtered.sort((a, b) => {
            if (a.done !== b.done) return a.done ? 1 : -1;
            return (PRIORITY_META[b.priority]?.weight || 0) - (PRIORITY_META[a.priority]?.weight || 0);
          });
        } else if (sortBy === 'dueDate') {
          filtered.sort((a, b) => {
            if (a.done !== b.done) return a.done ? 1 : -1;
            if (!a.dueDate && !b.dueDate) return 0;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          });
        } else if (sortBy === 'alpha') {
          filtered.sort((a, b) => a.text.localeCompare(b.text));
        }

        return filtered;
      }

      // --- Main Render Function ---
      function render() {
        updateStats();

        // Update Status Pill Active UI
        statusFiltersEl.querySelectorAll('.status-pill').forEach(btn => {
          const isActive = btn.dataset.status === statusFilter;
          btn.className = `status-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap flex items-center gap-1 ${
            isActive
              ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-500/30'
              : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200/70 dark:hover:bg-slate-700/60'
          }`;
        });

        const visible = getVisibleTasks();

        if (visible.length === 0) {
          const emptyMsg = tasks.length === 0
            ? 'Your task list is clear! Add a new task above to get started.'
            : 'No tasks match your current filters or search query.';
          listEl.innerHTML = `
            <div class="text-center py-14 px-4">
              <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 mx-auto flex items-center justify-center mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              </div>
              <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">${emptyMsg}</p>
              ${tasks.length > 0 ? `<button id="resetFiltersBtn" class="mt-3 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Reset all filters</button>` : ''}
            </div>
          `;
          const resetBtn = document.getElementById('resetFiltersBtn');
          if (resetBtn) {
            resetBtn.addEventListener('click', () => {
              statusFilter = 'all';
              categoryFilter = 'all';
              searchQuery = '';
              filterCategoryEl.value = 'all';
              searchInput.value = '';
              clearSearchBtn.classList.add('hidden');
              render();
            });
          }
          return;
        }

        listEl.innerHTML = visible.map(t => {
          const prio = PRIORITY_META[t.priority] || PRIORITY_META.medium;
          const cat = CATEGORY_META[t.category] || CATEGORY_META.Work;
          const dueInfo = formatDueDate(t.dueDate);
          const subtasks = t.subtasks || [];
          const doneSubs = subtasks.filter(s => s.done).length;
          const hasDetails = Boolean(t.note || subtasks.length > 0 || expandedTasks.has(t.id));
          const isExpanded = expandedTasks.has(t.id);

          let dueBadgeClasses = 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
          if (!t.done && dueInfo) {
            if (dueInfo.status === 'overdue') dueBadgeClasses = 'bg-rose-100 text-rose-700 dark:bg-rose-950/90 dark:text-rose-300 font-semibold';
            else if (dueInfo.status === 'today') dueBadgeClasses = 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950/90 dark:text-indigo-300 font-semibold';
          }

          return `
            <li 
              class="group rounded-2xl border border-slate-200/80 dark:border-slate-800/90 bg-white dark:bg-slate-900 hover:border-slate-300 dark:hover:border-slate-700 transition-all duration-150 shadow-2xs hover:shadow-md ${t.done ? 'opacity-70 bg-slate-50/50 dark:bg-slate-900/40' : ''}" 
              data-id="${t.id}"
              draggable="${sortBy === 'manual'}"
            >
              <div class="p-3.5 sm:px-4 flex items-start gap-3">
                <!-- Drag Handle -->
                <div class="drag-handle cursor-grab active:cursor-grabbing text-slate-300 dark:text-slate-700 hover:text-slate-400 pt-1 hidden sm:block" title="Drag to reorder">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M7 2a2 2 0 1 0 .001 4.001A2 2 0 0 0 7 2zm0 6a2 2 0 1 0 .001 4.001A2 2 0 0 0 7 8zm0 6a2 2 0 1 0 .001 4.001A2 2 0 0 0 7 14zm6-8a2 2 0 1 0-.001-4.001A2 2 0 0 0 13 6zm0 2a2 2 0 1 0 .001 4.001A2 2 0 0 0 13 8zm0 6a2 2 0 1 0 .001 4.001A2 2 0 0 0 13 14z"/></svg>
                </div>

                <!-- Custom Checkbox -->
                <button 
                  type="button"
                  aria-label="Toggle task completion"
                  class="check check-bounce mt-0.5 w-5 h-5 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-all cursor-pointer ${
                    t.done 
                      ? 'bg-indigo-600 border-indigo-600 text-white' 
                      : 'border-slate-300 dark:border-slate-600 hover:border-indigo-500'
                  }"
                >
                  ${t.done ? `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>` : ''}
                </button>

                <!-- Main Task Content -->
                <div class="flex-1 min-w-0">
                  <div class="flex flex-wrap items-center gap-1.5 mb-1">
                    <!-- Category Badge -->
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-medium border ${cat.classes}">
                      <span>${cat.icon}</span> ${escapeHtml(t.category || 'Work')}
                    </span>

                    <!-- Priority Badge -->
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold border ${prio.classes}">
                      ${prio.label}
                    </span>

                    <!-- Due Date Badge -->
                    ${dueInfo ? `
                      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] ${dueBadgeClasses}">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
                        ${escapeHtml(dueInfo.text)}
                      </span>
                    ` : ''}

                    <!-- Subtask Counter Pill -->
                    ${subtasks.length > 0 ? `
                      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-medium">
                        ☑ ${doneSubs}/${subtasks.length}
                      </span>
                    ` : ''}
                  </div>

                  <!-- Task Text -->
                  <p class="task-title text-sm sm:text-[15px] font-medium break-words leading-snug ${t.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}" title="Double-click to edit">
                    ${escapeHtml(t.text)}
                  </p>

                  <!-- Note Preview -->
                  ${t.note ? `
                    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${escapeHtml(t.note)}</p>
                  ` : ''}
                </div>

                <!-- Right Action Buttons -->
                <div class="flex items-center gap-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                  <button type="button" class="expand-btn p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800" title="Subtasks & Details">
                    <svg class="w-4 h-4 transition-transform ${isExpanded ? 'rotate-180 text-indigo-500' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                  </button>
                  <button type="button" class="edit-btn p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800" title="Edit Task">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/></svg>
                  </button>
                  <button type="button" class="del p-1.5 rounded-lg text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50" title="Delete Task">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                  </button>
                </div>
              </div>

              <!-- Expandable Subtasks Drawer -->
              ${isExpanded ? `
                <div class="px-4 pb-3.5 pt-2 border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-950/40 rounded-b-2xl space-y-2">
                  <div class="space-y-1.5">
                    ${subtasks.length === 0 ? `<p class="text-xs text-slate-400 italic">No subtasks yet. Add a checklist item below.</p>` : ''}
                    ${subtasks.map(st => `
                      <div class="flex items-center justify-between gap-2 text-xs py-1 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-900">
                        <label class="flex items-center gap-2 cursor-pointer flex-1">
                          <input type="checkbox" data-subid="${st.id}" class="subtask-check rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" ${st.done ? 'checked' : ''}>
                          <span class="${st.done ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-300'}">${escapeHtml(st.text)}</span>
                        </label>
                        <button type="button" data-subid="${st.id}" class="subtask-del text-slate-400 hover:text-rose-500 px-1">✕</button>
                      </div>
                    `).join('')}
                  </div>
                  <div class="flex gap-2 pt-1">
                    <input type="text" placeholder="Add a subtask step..." class="subtask-input flex-1 px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:border-indigo-500">
                    <button type="button" class="subtask-add-btn px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">Add</button>
                  </div>
                </div>
              ` : ''}
            </li>
          `;
        }).join('');

        // Bind Task Item Events
        listEl.querySelectorAll('li[data-id]').forEach(li => {
          const id = li.dataset.id;

          li.querySelector('.check').addEventListener('click', () => toggleTask(id));
          li.querySelector('.del').addEventListener('click', () => removeTask(id));
          li.querySelector('.edit-btn').addEventListener('click', () => openEditModal(id));
          li.querySelector('.task-title').addEventListener('dblclick', () => openEditModal(id));

          li.querySelector('.expand-btn').addEventListener('click', () => {
            if (expandedTasks.has(id)) expandedTasks.delete(id);
            else expandedTasks.add(id);
            render();
          });

          // Subtasks events
          li.querySelectorAll('.subtask-check').forEach(chk => {
            chk.addEventListener('change', () => toggleSubtask(id, chk.dataset.subid));
          });
          li.querySelectorAll('.subtask-del').forEach(btn => {
            btn.addEventListener('click', () => deleteSubtask(id, btn.dataset.subid));
          });

          const subInput = li.querySelector('.subtask-input');
          const subAddBtn = li.querySelector('.subtask-add-btn');
          if (subInput && subAddBtn) {
            subAddBtn.addEventListener('click', () => addSubtaskInline(id, subInput.value));
            subInput.addEventListener('keydown', e => {
              if (e.key === 'Enter') {
                e.preventDefault();
                addSubtaskInline(id, subInput.value);
              }
            });
          }

          // Drag and drop events
          li.addEventListener('dragstart', e => {
            draggedTaskId = id;
            li.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          li.addEventListener('dragend', () => {
            draggedTaskId = null;
            li.classList.remove('dragging');
            listEl.querySelectorAll('li').forEach(el => el.classList.remove('drag-over'));
          });
          li.addEventListener('dragover', e => {
            e.preventDefault();
            if (draggedTaskId && draggedTaskId !== id) {
              li.classList.add('drag-over');
            }
          });
          li.addEventListener('dragleave', () => {
            li.classList.remove('drag-over');
          });
          li.addEventListener('drop', e => {
            e.preventDefault();
            li.classList.remove('drag-over');
            if (!draggedTaskId || draggedTaskId === id) return;
            const fromIdx = tasks.findIndex(t => t.id === draggedTaskId);
            const toIdx = tasks.findIndex(t => t.id === id);
            if (fromIdx !== -1 && toIdx !== -1) {
              const [moved] = tasks.splice(fromIdx, 1);
              tasks.splice(toIdx, 0, moved);
              saveTasks();
              render();
            }
          });
        });
      }

      // --- Event Listeners ---
      addTaskForm.addEventListener('submit', addTask);

      toggleExtraInputBtn.addEventListener('click', () => {
        extraInputContainer.classList.toggle('hidden');
      });

      statusFiltersEl.addEventListener('click', e => {
        const btn = e.target.closest('button[data-status]');
        if (!btn) return;
        statusFilter = btn.dataset.status;
        render();
      });

      filterCategoryEl.addEventListener('change', () => {
        categoryFilter = filterCategoryEl.value;
        render();
      });

      sortSelectEl.addEventListener('change', () => {
        sortBy = sortSelectEl.value;
        render();
      });

      searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value.trim();
        clearSearchBtn.classList.toggle('hidden', !searchQuery);
        render();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        render();
      });

      // Global Keyboard Shortcuts ('/' or Cmd/Ctrl+K to focus search, Escape to close modal)
      document.addEventListener('keydown', e => {
        if ((e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && !editModal.classList.contains('hidden')) {
          closeEdit();
        }
      });

      clearDoneBtn.addEventListener('click', () => {
        const doneCount = tasks.filter(t => t.done).length;
        if (doneCount === 0) {
          showToast('No completed tasks to clear');
          return;
        }
        tasks = tasks.filter(t => !t.done);
        saveTasks();
        render();
        showToast(`Cleared ${doneCount} completed task${doneCount === 1 ? '' : 's'}`);
      });

      markAllBtn.addEventListener('click', () => {
        if (tasks.length === 0) return;
        const allDone = tasks.every(t => t.done);
        tasks.forEach(t => t.done = !allDone);
        saveTasks();
        render();
        if (!allDone) {
          fireConfetti();
          showToast('🎉 All tasks marked as completed!');
        }
      });

      // Initialize Header Date & App
      document.getElementById('currentDateBadge').textContent = new Date().toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });

      initTheme();
      loadTasks();
      render();
    })();
  </script>
</body>
</html>
